<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Site Admin — Berryboy Art Gallery</title>
  <link rel="preconnect" href="https://bazbszvhoxmuekxahokc.supabase.co" crossorigin>
  <link rel="stylesheet" href="./styles/admin.css?v=20260803">
</head>
<body>
  <div id="adminLogin" class="adminLogin" hidden>
    <form id="adminLoginForm" class="adminLoginCard">
      <div class="brandMark">BB</div>
      <p class="eyebrow">Berryboy Art Gallery</p>
      <h1>Site Admin</h1>
      <p class="muted">Zaloguj się kontem przypisanym do platformy, Venue lub wystawy.</p>
      <label>E-mail<input id="adminEmail" type="email" autocomplete="username" required></label>
      <label>Hasło<input id="adminPassword" type="password" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Zaloguj</button>
      <p id="adminLoginError" class="formError" role="alert"></p>
      <a href="../">Wróć na stronę publiczną</a>
    </form>
  </div>

  <div id="adminApp" class="adminLayout" hidden>
    <aside id="adminSidebar" class="adminSidebar" aria-label="Nawigacja panelu"></aside>
    <div class="adminMain">
      <header id="adminHeader" class="adminHeader"></header>
      <main id="adminView" class="adminView" tabindex="-1"></main>
    </div>
  </div>

  <div id="adminToastRegion" class="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <dialog id="adminDialog" class="adminDialog"><div id="adminDialogContent"></div></dialog>
  <script type="module" src="./app.js?v=release_20260803"></script>
</body>
</html>
